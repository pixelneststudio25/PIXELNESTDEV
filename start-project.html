<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start a project | PixelNestDev</title>
  <meta name="description" content="Tell PixelNestDev about your project in about 3 minutes. Tap your answers and we'll reply within 2 hours.">
  <link rel="icon" type="image/svg+xml" href="Favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Montserrat:wght@400;500;600;700&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/boxicons/2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="questionnaire.css?v=4">
</head>
<body class="q-page">
  <canvas id="dust-canvas"></canvas>

  <nav>
    <div class="logo"><a href="index.html"><img src="assets/logo.svg" alt="PixelNestDev" class="logo-img"></a></div>
    <a href="index.html" class="q-exit"><i class='bx bx-arrow-back'></i> Back to site</a>
  </nav>

  <main class="q-wrap">
    <section class="q-main" aria-live="polite">
      <div class="q-progress" id="progress">
        <div class="q-bar" aria-hidden="true"><span id="bar"></span></div>
        <small id="left"></small>
        <button type="button" class="brief-chip" id="briefChip" aria-expanded="false"><i class='bx bx-list-check'></i><span>Brief</span></button>
      </div>
      <div class="q-stage" id="stage"></div>
      <noscript><p class="hint">This form needs JavaScript. Email us at <a href="mailto:daniel@pixelnestdev.com">daniel@pixelnestdev.com</a> instead.</p></noscript>
    </section>

    <aside class="brief" id="brief">
      <div class="brief-body">
        <button type="button" class="brief-close" id="briefClose" aria-label="Close brief"><i class='bx bx-x'></i></button>
        <h3>Your project brief</h3>
        <ul id="briefList"></ul>
        <p class="hint" id="briefEmpty">Your answers build up here as you go.</p>
      </div>
    </aside>
  </main>

  <script src="script.js"></script>
  <script src="questionnaire.js?v=3"></script>
</body>
</html>
